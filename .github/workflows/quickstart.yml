name: SafeContext Quickstart Demo

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/quickstart.yml"

permissions:
  contents: read

jobs:
  quickstart:
    name: Test installed CLI quickstart
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install built SafeContext package
        run: |
          pip install dist/*.whl

      - name: Verify installed CLI
        run: |
          safecontext --help

      - name: Run SafeContext quickstart
        run: |
          safecontext quickstart
