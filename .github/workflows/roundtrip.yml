name: SafeContext Round-Trip

on:
  workflow_dispatch:

jobs:
  roundtrip:
    name: Protect and restore synthetic data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SafeContext
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Protect synthetic log
        run: |
          safecontext protect examples/sample.log

      - name: Verify protected log
        run: |
          echo "===== PROTECTED LOG ====="
          cat examples/sample.protected.log

          if grep -q "alice@example.com" examples/sample.protected.log; then
            echo "ERROR: email address leaked into protected output"
            exit 1
          fi

          if grep -q "prod-auth-01.internal" examples/sample.protected.log; then
            echo "ERROR: hostname leaked into protected output"
            exit 1
          fi

          if grep -q "10.20.30.40" examples/sample.protected.log; then
            echo "ERROR: IP address leaked into protected output"
            exit 1
          fi

          echo "Protected log validation passed."

      - name: Simulate external LLM response
        run: |
          cat > examples/llm-response.md <<'EOF'
          # Security Analysis

          Multiple failed authentication attempts were observed.

          Recommended action:

          Investigate EMAIL_3254C673 and review authentication events on
          HOST_2221EF20 originating from IP_6509F946.

          A separate request contained [SECRET_REDACTED].
          EOF

      - name: Restore local context
        run: |
          safecontext restore \
            -m examples/.sample.safecontext-map.json \
            -o examples/llm-response.restored.md \
            examples/llm-response.md

      - name: Show restored analysis
        run: |
          echo "===== RESTORED ANALYSIS ====="
          cat examples/llm-response.restored.md

      - name: Verify round-trip
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("examples/llm-response.restored.md").read_text()

          expected = [
              "alice@example.com",
              "prod-auth-01.internal",
              "10.20.30.40",
          ]

          missing = [value for value in expected if value not in output]

          if missing:
              raise SystemExit(
                  "ROUND-TRIP FAILED. Values were not restored: "
                  + ", ".join(missing)
              )

          if "[SECRET_REDACTED]" not in output:
              raise SystemExit(
                  "ROUND-TRIP FAILED. Secret redaction marker disappeared."
              )

          print("ROUND-TRIP SUCCESS")
          print("Identifiers restored correctly.")
          print("Secret remained redacted.")
          PY
