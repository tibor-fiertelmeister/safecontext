name: SafeContext Round-Trip

on:
  workflow_dispatch:

jobs:
  roundtrip:
    name: Protect and restore synthetic data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SafeContext
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Protect synthetic log
        run: |
          safecontext protect examples/sample.log

      - name: Show protected log
        run: |
          echo "===== PROTECTED LOG ====="
          cat examples/sample.protected.log

      - name: Verify sensitive values are removed
        run: |
          python - <<'PY'
          from pathlib import Path

          protected = Path("examples/sample.protected.log").read_text()

          sensitive_values = [
              "alice@example.com",
              "prod-auth-01.internal",
              "10.20.30.40",
          ]

          leaked = [
              value for value in sensitive_values
              if value in protected
          ]

          if leaked:
              raise SystemExit(
                  "PRIVACY CHECK FAILED. Sensitive values found: "
                  + ", ".join(leaked)
              )

          print("PRIVACY CHECK PASSED")
          PY

      - name: Simulate external LLM response
        run: |
          {
            echo "# Security Analysis"
            echo
            echo "The following protected events were analyzed:"
            echo
            cat examples/sample.protected.log
            echo
            echo "Recommendation:"
            echo "Investigate the affected pseudonymized entities."
          } > examples/llm-response.md

      - name: Show simulated LLM response
        run: |
          echo "===== SIMULATED LLM RESPONSE ====="
          cat examples/llm-response.md

      - name: Restore local context
        run: |
          safecontext restore \
            -m examples/.sample.safecontext-map.json \
            -o examples/llm-response.restored.md \
            examples/llm-response.md

      - name: Show restored analysis
        run: |
          echo "===== RESTORED ANALYSIS ====="
          cat examples/llm-response.restored.md

      - name: Verify round-trip
        run: |
          python - <<'PY'
          from pathlib import Path

          original = Path("examples/sample.log").read_text()
          restored = Path("examples/llm-response.restored.md").read_text()

          expected = [
              value
              for value in [
                  "alice@example.com",
                  "prod-auth-01.internal",
                  "10.20.30.40",
              ]
              if value in original
          ]

          missing = [
              value for value in expected
              if value not in restored
          ]

          if missing:
              raise SystemExit(
                  "ROUND-TRIP FAILED. Values were not restored: "
                  + ", ".join(missing)
              )

          if "[SECRET_REDACTED]" not in restored:
              raise SystemExit(
                  "ROUND-TRIP FAILED. Secret redaction marker disappeared."
              )

          print("ROUND-TRIP SUCCESS")
          print("Original identifiers restored correctly.")
          print("Secrets remained redacted.")
          PY
